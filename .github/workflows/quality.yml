name: quality

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      ORQUESTADOR_CI: true
      HOME: /tmp/orq-home
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Prepare isolated HOME
        run: mkdir -p "$HOME"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check:node

      - name: Local quality gate
        run: npm run quality:gate

      - name: Generate redacted quality artifacts
        run: npm run quality:artifacts:dry-run -- --out-dir=/tmp/orq-quality-artifacts-ci

      - name: Upload redacted quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-redacted-json
          path: /tmp/orq-quality-artifacts-ci/*.json
          retention-days: 3
          if-no-files-found: error
